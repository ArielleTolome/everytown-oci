<!doctype html>
<!-- README banner. Render to banner.png with: python3 scripts/build_readme_media.py banner -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Source Serif 4"; src: url("../../frontend/public/fonts/SourceSerif4-latin-var.woff2") format("woff2"); font-weight: 200 900; }
  @font-face { font-family: "Atkinson Hyperlegible"; src: url("../../frontend/public/fonts/AtkinsonHyperlegible-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Atkinson Hyperlegible"; src: url("../../frontend/public/fonts/AtkinsonHyperlegible-Bold.ttf"); font-weight: 700; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 400px; overflow: hidden; }
  .banner { position: relative; width: 1280px; height: 400px; overflow: hidden; color: #fff;
    background: radial-gradient(900px 500px at 88% 120%, #0D3DD9 0%, rgba(13,61,217,0) 60%), linear-gradient(135deg, #001C60 0%, #000E2F 100%);
    font-family: "Atkinson Hyperlegible", sans-serif; }
  .stripe { position: absolute; inset: 0 0 auto 0; height: 6px; background: #FF352E; }
  .copy { position: absolute; left: 72px; top: 58px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #BCCBEF; }
  .brand svg { fill: #F89C25; }
  h1 { margin-top: 18px; font-family: "Source Serif 4", Georgia, serif; font-weight: 500; font-size: 76px; line-height: 1.02; letter-spacing: -.01em; }
  p { margin-top: 18px; font-size: 22px; line-height: 1.4; color: #E7EDFC; }
  .chips { position: absolute; left: 72px; bottom: 44px; display: flex; gap: 10px; }
  .chip { padding: 7px 16px; border: 1.5px solid #455FA0; border-radius: 999px; font-size: 15px; font-weight: 700; color: #fff; background: rgba(255,255,255,.04); }
  .shot { position: absolute; right: -60px; top: 54px; width: 560px; height: 380px; border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(188,203,239,.4); transform: rotate(-3deg); transform-origin: left top; }
  .shot .bar { height: 30px; background: #F2F5FC; display: flex; align-items: center; gap: 7px; padding-left: 14px; border-bottom: 1px solid #BCCBEF; }
  .shot .bar i { width: 11px; height: 11px; border-radius: 50%; background: #BCCBEF; }
  .shot img { display: block; width: 900px; margin: 14px 0 0 22px; transform: scale(.66); transform-origin: left top; }
</style>
</head>
<body>
<div class="banner">
  <div class="stripe"></div>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 28 30" width="25" height="27" aria-hidden="true"><rect x="0" y="2" width="28" height="6" rx="1"/><rect x="0" y="12" width="21" height="6" rx="1"/><rect x="0" y="22" width="14" height="6" rx="1"/></svg>
      Everytown Community Safety Fund
    </div>
    <h1>OCI Capacity Coach</h1>
    <p>Answer Yes or No. Get a plain-language plan: the one or two things to start with, and 12 weeks of steps.</p>
  </div>
  <div class="chips">
    <span class="chip">Code scores, AI explains</span>
    <span class="chip">Claude on Amazon Bedrock</span>
    <span class="chip">English and Español</span>
  </div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="../pitch/img/report-start.jpg" alt=""></div>
</div>
</body>
</html>
