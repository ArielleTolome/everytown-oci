{% extends "base.html" %}
{% block body %}
<h2>Your organization</h2>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post">
  <label for="org_name">Organization name</label>
  <input id="org_name" name="org_name" type="text" value="{{ org.name or '' }}" required>
  <label for="org_url">Website URL</label>
  <input id="org_url" name="org_url" type="text" inputmode="url" placeholder="https://example.org" value="{{ org.url or '' }}" required>
  <br><button type="submit">Continue to questionnaire</button>
</form>
{% endblock %}
