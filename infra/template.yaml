AWSTemplateFormatVersion: "2010-09-09"
Description: Everytown OCI Capacity Coach app. CloudFront (S3 static site + /api/* to one Lambda), Aurora via RDS Data API, Bedrock Knowledge Base on S3 Vectors.

Parameters:
  SecretKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Flask session secret.
  ModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-5-5
  FastModelId:
    Type: String
    Default: us.anthropic.claude-haiku-5-5
  Domains:
    Type: String
    Default: PL,FR,FM,ML
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  DbClusterArn:
    Type: String
    Description: DbClusterArn output of the everytown-oci-db stack.
  DbSecretArn:
    Type: String
    Description: DbSecretArn output of the everytown-oci-db stack (RDS-managed master secret).
  DbName:
    Type: String
    Default: oci
  ReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Cap on concurrent Lambda runs (web requests and async AI worker runs share it); bounds Bedrock spend.
  MonthlyBudgetUsd:
    Type: Number
    Default: 100
    MinValue: 0
    Description: Monthly AWS cost budget in USD (tracking only, no alerts until a subscriber is added). 0 skips it, for accounts that deny budgets:ModifyBudget.
  PhoenixEndpoint:
    Type: String
    Default: ""
    Description: Arize Phoenix base URL (PhoenixUrl output of the everytown-oci-obs stack). Empty sends traces to CloudWatch only.
  PhoenixApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Phoenix system API key for OTLP traces (created by scripts/deploy_observability.sh).

Conditions:
  CreateBudget: !Not [!Equals [!Ref MonthlyBudgetUsd, 0]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket

  VectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
      IndexName: oci-library
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys: [AMAZON_BEDROCK_TEXT, AMAZON_BEDROCK_METADATA]

  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: kb
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocsBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DocsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - s3vectors:GetIndex
                  - s3vectors:PutVectors
                  - s3vectors:GetVectors
                  - s3vectors:DeleteVectors
                  - s3vectors:QueryVectors
                  - s3vectors:ListVectors
                Resource: !GetAtt VectorIndex.IndexArn

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Sub ${AWS::StackName}-library
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
          EmbeddingModelConfiguration:
            BedrockEmbeddingModelConfiguration:
              Dimensions: 1024
              EmbeddingDataType: FLOAT32
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          IndexArn: !GetAtt VectorIndex.IndexArn

  DataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      Name: library-docs
      KnowledgeBaseId: !Ref KnowledgeBase
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt DocsBucket.Arn
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 400
            OverlapPercentage: 15

  # Responsible AI: an Amazon Bedrock Guardrail on every Claude call (pipeline._converse).
  Guardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub ${AWS::StackName}-guardrail
      Description: Content, prompt-attack and personal-data filters for the OCI Capacity Coach.
      BlockedInputMessaging: This request did not pass our safety check, so the AI did not answer it.
      BlockedOutputsMessaging: The AI answer did not pass our safety check, so we did not show it.
      ContentPolicyConfig:
        FiltersConfig:
          - { Type: HATE, InputStrength: MEDIUM, OutputStrength: MEDIUM }
          - { Type: INSULTS, InputStrength: MEDIUM, OutputStrength: MEDIUM }
          - { Type: SEXUAL, InputStrength: MEDIUM, OutputStrength: MEDIUM }
          # CVI work is about violence: field guides and answers describe it, so input is not filtered.
          - { Type: VIOLENCE, InputStrength: NONE, OutputStrength: LOW }
          - { Type: PROMPT_ATTACK, InputStrength: HIGH, OutputStrength: NONE }
      SensitiveInformationPolicyConfig:
        # Masked in model text. No ADDRESS: it also masks the city an organization serves. No NAME: org names.
        PiiEntitiesConfig:
          - { Type: EMAIL, Action: ANONYMIZE }
          - { Type: PHONE, Action: ANONYMIZE }
          - { Type: US_SOCIAL_SECURITY_NUMBER, Action: ANONYMIZE }
          - { Type: CREDIT_DEBIT_CARD_NUMBER, Action: ANONYMIZE }

  GuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt Guardrail.GuardrailId
      Description: v1  # change this text to publish a new version after editing the guardrail

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-app
      RetentionInDays: 14

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess  # OTLP spans to X-Ray / CloudWatch Transaction Search
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds-data:ExecuteStatement
                  - rds-data:BatchExecuteStatement
                  - rds-data:BeginTransaction
                  - rds-data:CommitTransaction
                  - rds-data:RollbackTransaction
                Resource: !Ref DbClusterArn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbSecretArn
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.*
                  - arn:aws:bedrock:*::foundation-model/anthropic.*
              - Effect: Allow
                Action: bedrock:Retrieve
                Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn
              - Effect: Allow  # read-aloud (features/tts.py); Polly has no resource-level permissions
                Action: polly:SynthesizeSpeech
                Resource: "*"
              - Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !GetAtt Guardrail.GuardrailArn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-app

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-app
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: lambda_handler.handler
      Timeout: 300
      MemorySize: 1024
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          OCI_DB_CLUSTER_ARN: !Ref DbClusterArn
          OCI_DB_SECRET_ARN: !Ref DbSecretArn
          OCI_DB_NAME: !Ref DbName
          OCI_SECRET_KEY: !Ref SecretKey
          OCI_WORKER_FN: !Sub ${AWS::StackName}-app
          OCI_KB_ID: !Ref KnowledgeBase
          OCI_MODEL_ID: !Ref ModelId
          OCI_FAST_MODEL_ID: !Ref FastModelId
          OCI_DOMAINS: !Ref Domains
          OCI_GUARDRAIL_ID: !GetAtt Guardrail.GuardrailId
          OCI_GUARDRAIL_VERSION: !GetAtt GuardrailVersion.Version
          OCI_TRACES: xray  # observability.py: OpenTelemetry spans to X-Ray (needs Transaction Search, see deploy.sh)
          OCI_PHOENIX_ENDPOINT: !Ref PhoenixEndpoint  # and to Phoenix too, when set
          OCI_PHOENIX_API_KEY: !Ref PhoenixApiKey

  AsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref Function
      Qualifier: $LATEST
      MaximumRetryAttempts: 0

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: AWS_IAM # only CloudFront (signed via the ApiOAC origin access control) can call it

  # Permissions documented for CloudFront OAC with Lambda function URLs: both actions, for the CloudFront
  # service principal, limited to this distribution. The ARN is built from the distribution Ref (no cycle:
  # the distribution does not depend on these permissions).
  CloudFrontUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
      FunctionUrlAuthType: AWS_IAM

  CloudFrontInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
      InvokedViaFunctionUrl: true

  ApiOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-api
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Astro static build: /results/ -> /results/index.html; /results -> 301 /results/ (query string kept).
  DirectoryIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-dir-index
      AutoPublish: true
      FunctionConfig:
        Comment: Directory index, trailing-slash redirect and 404 page for the static site (default behavior only)
        Runtime: cloudfront-js-2.0
      # Pages are listed here instead of using distribution-wide CustomErrorResponses, which would also rewrite
      # the API's own 403/404 JSON on /api/*. Keep this list in sync with frontend/src/pages.
      FunctionCode: |
        var PAGES = { '/': 1, '/login/': 1, '/plan/': 1, '/questionnaire/': 1, '/resume/': 1, '/results/': 1, '/staff/': 1 };
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = PAGES[uri] ? uri + 'index.html' : '/404.html';
            return request;
          }
          if (uri.substring(uri.lastIndexOf('/') + 1).indexOf('.') !== -1) {
            return request;
          }
          if (!PAGES[uri + '/']) {
            request.uri = '/404.html';
            return request;
          }
          var parts = [];
          for (var key in request.querystring) {
            var q = request.querystring[key];
            var values = q.multiValue ? q.multiValue : [q];
            for (var i = 0; i < values.length; i++) {
              parts.push(values[i].value === '' ? key : key + '=' + values[i].value);
            }
          }
          var location = uri + '/' + (parts.length ? '?' + parts.join('&') : '');
          return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: location } } };
        }

  # The viewer-request rewrite to /404.html is served by S3 with 200. scripts/deploy.sh uploads 404.html with
  # x-amz-meta-oci-status: 404, and this sets the real status (in viewer-response, event.request is the viewer's
  # original request, so the rewritten URI is not visible here).
  NotFoundStatusFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-not-found-status
      AutoPublish: true
      FunctionConfig:
        Comment: HTTP 404 for the static site's 404 page (default behavior only)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var response = event.response;
          var status = response.headers['x-amz-meta-oci-status'];
          if (status) {
            delete response.headers['x-amz-meta-oci-status'];
            if (status.value === '404') {
              response.statusCode = 404;
              response.statusDescription = 'Not Found';
            }
          }
          return response;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} OCI Capacity Coach
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
            # POST/PUT bodies must arrive with x-amz-content-sha256 (hex SHA-256 of the body) from the viewer;
            # AllViewerExceptHostHeader forwards it and CloudFront signs it. A missing or wrong hash is a 403.
            OriginAccessControlId: !GetAtt ApiOAC.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndexFunction.FunctionMetadata.FunctionARN
            - EventType: viewer-response
              FunctionARN: !GetAtt NotFoundStatusFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # SecurityHeadersPolicy
        # No CustomErrorResponses: they apply to every behavior and would replace the API's JSON errors.
        # Unknown site paths get /404.html from DirectoryIndexFunction instead.

  # ---------- CloudWatch: Bedrock invocation logs, dashboard, alarms ----------

  BedrockInvocationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/bedrock/${AWS::StackName}/model-invocations
      RetentionInDays: 14

  BedrockLoggingRole:  # assumed by Bedrock to write model invocation logs (scripts/deploy.sh turns the logging on)
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike: { aws:SourceArn: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*" }
      Policies:
        - PolicyName: invocation-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${BedrockInvocationLogGroup.Arn}

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref AWS::StackName
      DashboardBody: !Sub
        - |
          {"start": "-P1D", "widgets": [
            {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": {"markdown": "## Everytown OCI Capacity Coach: AI observability\nEvery report is one trace in [Transaction Search](#xray:traces/query) (service `everytown-oci`; evals are `everytown-oci-evals`). Model inputs and outputs: [generative AI observability](#gen-ai-observability/model-invocations) and the `${BedrockLogs}` log group. Code scores; these charts watch the AI steps around the scores."}},
            {"type": "metric", "x": 0, "y": 2, "width": 8, "height": 6, "properties": {"title": "Bedrock invocations by model", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300, "metrics": [[{"expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"Invocations\"', 'Sum', 300)", "id": "e1"}]]}},
            {"type": "metric", "x": 8, "y": 2, "width": 8, "height": 6, "properties": {"title": "Bedrock tokens by model", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300, "metrics": [[{"expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"InputTokenCount\" OR MetricName=\"OutputTokenCount\"', 'Sum', 300)", "id": "e2"}]]}},
            {"type": "metric", "x": 16, "y": 2, "width": 8, "height": 6, "properties": {"title": "Bedrock latency p90 (ms)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "p90", "period": 300, "metrics": [[{"expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"InvocationLatency\"', 'p90', 300)", "id": "e3"}]]}},
            {"type": "metric", "x": 0, "y": 8, "width": 12, "height": 6, "properties": {"title": "Live report checks: failures", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300, "metrics": [[{"expression": "SEARCH('{EverytownOCI/Quality,Check} MetricName=\"CheckFailed\"', 'Sum', 300)", "id": "e4"}]]}},
            {"type": "metric", "x": 12, "y": 8, "width": 12, "height": 6, "properties": {"title": "Live report checks: mean score", "region": "${AWS::Region}", "view": "bar", "stat": "Average", "period": 300, "setPeriodToTimeRange": true, "metrics": [[{"expression": "SEARCH('{EverytownOCI/Quality,Check} MetricName=\"CheckScore\"', 'Average', 300)", "id": "e5"}]]}},
            {"type": "metric", "x": 0, "y": 14, "width": 12, "height": 6, "properties": {"title": "Eval suites: mean score by evaluator", "region": "${AWS::Region}", "view": "bar", "stat": "Average", "period": 300, "setPeriodToTimeRange": true, "metrics": [[{"expression": "SEARCH('{EverytownOCI/Evals,Suite,Evaluator} MetricName=\"MeanScore\"', 'Average', 300)", "id": "e6"}]]}},
            {"type": "metric", "x": 12, "y": 14, "width": 12, "height": 6, "properties": {"title": "Eval suites: gate failures and cost (USD)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300, "metrics": [[{"expression": "SEARCH('{EverytownOCI/Evals,Suite} MetricName=\"GateFailures\" OR MetricName=\"CostUSD\"', 'Sum', 300)", "id": "e7"}]]}},
            {"type": "metric", "x": 0, "y": 20, "width": 12, "height": 6, "properties": {"title": "App Lambda", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300, "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${Fn}"], [".", "Errors", ".", "."], [".", "Throttles", ".", "."]]}},
            {"type": "log", "x": 12, "y": 20, "width": 12, "height": 6, "properties": {"title": "Latest app errors", "region": "${AWS::Region}", "view": "table", "query": "SOURCE '/aws/lambda/${Fn}' | fields @timestamp, @message | filter @message like /ERROR|Traceback/ | sort @timestamp desc | limit 20"}}
          ]}
        - Fn: !Sub ${AWS::StackName}-app
          BedrockLogs: !Ref BedrockInvocationLogGroup

  GroundingAlarm:  # a live report shipped an action that cites no growth priority: the validator should make this impossible
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-report-grounding
      AlarmDescription: A live report failed the grounded check (evals/checks.py). Open the trace in Transaction Search.
      Namespace: EverytownOCI/Quality
      MetricName: CheckFailed
      Dimensions: [{ Name: Check, Value: grounded }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-app-errors
      AlarmDescription: The app Lambda raised errors (see the dashboard's Latest app errors).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Function }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # Cost tracking only. To get email alerts, add under Properties:
  #   NotificationsWithSubscribers:
  #     - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
  #       Subscribers: [{ SubscriptionType: EMAIL, Address: you@example.org }]
  #     - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
  #       Subscribers: [{ SubscriptionType: EMAIL, Address: you@example.org }]
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD

Outputs:
  AppUrl:
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
  SiteBucket:
    Value: !Ref SiteBucket
  DocsBucket:
    Value: !Ref DocsBucket
  KnowledgeBaseId:
    Value: !Ref KnowledgeBase
  DataSourceId:
    Value: !GetAtt DataSource.DataSourceId
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${AWS::StackName}
  TracesUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#xray:traces/query
  BedrockInvocationLogGroup:
    Value: !Ref BedrockInvocationLogGroup
  BedrockLoggingRoleArn:
    Value: !GetAtt BedrockLoggingRole.Arn
