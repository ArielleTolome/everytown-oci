AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Everytown OCI observability. Arize Phoenix (traces, annotations, datasets, experiments) on one EC2 instance
  with its data on a separate encrypted EBS volume, reachable only through CloudFront (HTTPS). Deploy with
  scripts/deploy_observability.sh, which generates the secrets and looks up the network parameters.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet (default VPC) for the instance.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone of SubnetId (the data volume must live in the same zone).
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Amazon Linux 2023 AMI, resolved by the deploy script from
      /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 on the first deploy and then kept,
      because a new AMI replaces the instance.
  InstanceType:
    Type: String
    Default: t3.small
  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: pl-[0-9a-f]+
    Description: Id of the managed prefix list com.amazonaws.global.cloudfront.origin-facing.
  PhoenixImage:
    Type: String
    Default: arizephoenix/phoenix:version-21.0.0
    Description: Pinned Phoenix container image.
  DataVolumeSize:
    Type: Number
    Default: 20
    MinValue: 8
    Description: Size in GiB of the Phoenix data volume (SQLite database), mounted at /data.
  PhoenixSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: PHOENIX_SECRET (signs session tokens).
  PhoenixAdminSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: PHOENIX_ADMIN_SECRET (bearer token with admin rights, used once to create the app's system API key).
  AdminInitialPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD for the admin@localhost user.

Conditions:
  UsEast1: !Equals [!Ref "AWS::Region", us-east-1]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Phoenix on 6006 from CloudFront origin-facing addresses only. No SSH; use SSM Session Manager.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6006
          ToPort: 6006
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-phoenix" }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-phoenix-data" }

  Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        # Hop limit 1: containers on the Docker bridge network cannot reach instance metadata or the role.
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Volumes:
        - Device: /dev/sdf
          VolumeId: !Ref DataVolume
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-phoenix" }
      # Runs once, on first boot. No `set -x`: the secrets below must not reach the console log.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          signal() {
            /opt/aws/bin/cfn-signal -e "$1" --stack ${AWS::StackName} --resource Instance --region ${AWS::Region} || true
          }
          trap 'signal 1' ERR
          dnf install -y docker aws-cfn-bootstrap

          # Data volume: format only when it has no filesystem yet, mount at /data on every boot.
          VOL_ID=${DataVolume}
          DEV=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_${!VOL_ID//-/}
          for _ in $(seq 60); do [ -e "$DEV" ] && break; sleep 5; done
          blkid "$DEV" || mkfs -t xfs -L phoenix-data "$DEV"
          UUID=$(blkid -s UUID -o value "$DEV")
          mkdir -p /data
          grep -q "$UUID" /etc/fstab || echo "UUID=$UUID /data xfs defaults,nofail 0 2" >> /etc/fstab
          mountpoint -q /data || mount /data

          # Docker starts on boot, but only after /data is mounted (so Phoenix never writes to the root disk).
          mkdir -p /etc/systemd/system/docker.service.d
          printf '[Unit]\nRequiresMountsFor=/data\n' > /etc/systemd/system/docker.service.d/data.conf
          systemctl daemon-reload
          systemctl enable --now docker

          install -m 600 /dev/null /etc/phoenix.env
          cat > /etc/phoenix.env <<'EOF'
          PHOENIX_WORKING_DIR=/data
          PHOENIX_ENABLE_AUTH=true
          PHOENIX_USE_SECURE_COOKIES=true
          PHOENIX_SECRET=${PhoenixSecret}
          PHOENIX_ADMIN_SECRET=${PhoenixAdminSecret}
          PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD=${AdminInitialPassword}
          EOF
          docker pull ${PhoenixImage}
          docker rm -f phoenix 2>/dev/null || true
          docker run -d --name phoenix --restart unless-stopped -p 6006:6006 -v /data:/data \
            --env-file /etc/phoenix.env --log-opt max-size=10m --log-opt max-file=3 ${PhoenixImage}

          for _ in $(seq 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:6006/healthz; then signal 0; exit 0; fi
            sleep 5
          done
          signal 1

  # Allocated separately from the association so CloudFront can be created while the instance boots.
  Eip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-phoenix" }

  EipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt Eip.AllocationId
      InstanceId: !Ref Instance

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} Arize Phoenix
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          - Id: phoenix
            # Public DNS name of the Elastic IP, stable across instance stop/start.
            DomainName: !Sub
              - ec2-${Dashed}.${Suffix}
              - Dashed: !Join ["-", !Split [".", !Ref Eip]]
                Suffix: !If [UsEast1, compute-1.amazonaws.com, !Sub "${AWS::Region}.compute.amazonaws.com"]
            CustomOriginConfig:
              HTTPPort: 6006
              # Plain HTTP stays inside AWS, and the security group only admits CloudFront.
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: phoenix
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer (cookies, Authorization, query strings)
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # SecurityHeadersPolicy

Outputs:
  PhoenixUrl:
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
  InstanceId:
    Value: !Ref Instance
  DataVolumeId:
    Value: !Ref DataVolume
  OriginDnsName:
    Description: Direct instance address (port 6006 is closed to everything except CloudFront).
    Value: !Sub
      - ec2-${Dashed}.${Suffix}
      - Dashed: !Join ["-", !Split [".", !Ref Eip]]
        Suffix: !If [UsEast1, compute-1.amazonaws.com, !Sub "${AWS::Region}.compute.amazonaws.com"]
